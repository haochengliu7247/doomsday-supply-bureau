[project]
name = "doomsday-supply-bureau"
version = "0.1.0"
description = "Translate real-world objects into post-apocalyptic supplies and survival choices."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio==6.26.0",
    "httpx>=0.28,<1",
    "json-repair>=0.50,<1",
    "pillow>=11,<13",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
